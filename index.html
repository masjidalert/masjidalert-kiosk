<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MasjidAlert Kiosk</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100vw; height: 100vh;
        background: #020614;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #scaler {
        width: 1280px;
        height: 720px;
        transform-origin: center center;
        flex-shrink: 0;
        background: #020614;
      }
      iframe {
        width: 1280px;
        height: 720px;
        border: none;
        display: block;
      }
    </style>
    <script>
      function scale() {
        var el = document.getElementById('scaler');
        if (!el) return;
        var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        el.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', scale);
      window.addEventListener('load', function() {
        scale();
        setTimeout(scale, 500);
        setTimeout(scale, 1500);
      });
      document.addEventListener('DOMContentLoaded', scale);
    </script>
  </head>
  <body>
    <div id="scaler">
      <iframe
        id="kiosk"
        src="/masjidalert-kiosk/kiosk.html"
        scrolling="no"
        allowfullscreen
      ></iframe>
    </div>
  </body>
</html>
