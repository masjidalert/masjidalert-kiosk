    <script>
      // Scale to fit any screen — runs before content loads
      (function() {
        function applyScale() {
          var vw = window.screen.availWidth  || window.screen.width  || window.innerWidth  || 1920;
          var vh = window.screen.availHeight || window.screen.height || window.innerHeight || 1080;
          var sx = vw / 1280;
          var sy = vh / 720;
          var s  = Math.min(sx, sy);
          var ox = Math.round((vw - 1280 * s) / 2);
          var oy = Math.round((vh - 720  * s) / 2);
          document.documentElement.style.transform =
            'translate(' + ox + 'px, ' + oy + 'px) scale(' + s + ')';
        }
        document.addEventListener('DOMContentLoaded', applyScale);
        window.addEventListener('load', applyScale);
        window.addEventListener('resize', applyScale);
        setTimeout(applyScale, 100);
        setTimeout(applyScale, 500);
        setTimeout(applyScale, 1500);
        setTimeout(applyScale, 3000);
      })();
    </script>
