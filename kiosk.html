      #root {
        width:1280px; height:720px; overflow:hidden;

    <script>
      function scale() {
        var r = document.getElementById('root');
        if (!r) return;
        // Use screen.width/height for Fire Stick (physical = 1920x1080)
        // Fall back to innerWidth/innerHeight for desktop browsers
        var sw = screen.width  || window.innerWidth  || 1920;
        var sh = screen.height || window.innerHeight || 1080;
        var s = Math.min(sw / 1280, sh / 720);
        r.style.transform = 'scale(' + s + ')';
        // Fill any gaps with background color
        document.body.style.background = '#020614';
      }
      window.addEventListener('load', scale);
      window.addEventListener('resize', scale);
      document.addEventListener('DOMContentLoaded', scale);
      [100, 400, 900, 2000, 4000].forEach(function(t){ setTimeout(scale, t); });
